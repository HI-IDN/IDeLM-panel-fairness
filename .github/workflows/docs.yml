name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - code/panel_workload.R
      - code/panel_schedule.R
      - code/models/**
      - data/tdf/panel.csv
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TinyTeX with the LaTeX packages the PDF needs; kept between runs so the PDF step does not
      # reinstall and update TeX Live every time. Quarto finds TinyTeX in ~/.TinyTeX by itself.
      - name: Cache TinyTeX
        id: tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('docs/_quarto.yml') }}
          restore-keys: tinytex-${{ runner.os }}-

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: ${{ steps.tinytex.outputs.cache-matched-key == '' }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::knitr
            any::rmarkdown
            any::kableExtra
            any::plotly
            any::cowplot
            any::ggalluvial
            any::viridisLite
            any::yaml

      - name: Render
        run: quarto render docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
