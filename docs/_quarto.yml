project:
  type: book
  output-dir: _output
  # The slides are not a chapter; this builds them into _output/ after the book.
  post-render: bash build_slides.sh

# The HÍ logos are not part of the theme extension; img/hi/ is copied from HI-IDN/quarto-hi.
book:
  title: "Sanngjarnari fagráðsfundir"
  subtitle: "Frumgerð byggð á APAP-sanngirnislíkaninu"
  author: "Dr. Helga Ingimundardóttir"
  date: today
  # Download icon in the navbar; the PDF is built from the same chapters.
  downloads: [pdf]
  output-file: sanngjarnari-fagradsfundir
  favicon: img/hi/favicon.svg
  navbar:
    pinned: true
    logo: img/hi/hi_named_logo-is.svg
    logo-alt: "Háskóli Íslands"
    logo-href: https://hi.is/
    right:
      - icon: github
        href: https://github.com/HI-IDN/IDeLM-panel-fairness
        aria-label: "Kóðasafn á GitHub"
  page-footer:
    background: "#10099F"
    foreground: "#ffffff"
    left: "© 2026 Helga Ingimundardóttir"
    right: "Quarto-sniðmát: [HI-IDN/quarto-hi](https://github.com/HI-IDN/quarto-hi)"
  chapters:
    - index.qmd
    - apap.qmd
    - data.qmd
    - fairness.qmd
    - model.qmd
    - scenarios.qmd
    - roles.qmd
    - assign.qmd
    - limitations.qmd
    # Kept out of `appendices`: that numbers them A, B, ... and they read better as plain pages.
    - part: "Viðaukar"
      chapters:
        - runtime.qmd
        - code.qmd
        - references.qmd

lang: is
bibliography: references.bib
# Icelandic long dates render as '2026 M09 29'; use a plain numeric date instead.
date-format: "D.M.YYYY"

language:
  crossref-fig-title: "Mynd"
  crossref-tbl-title: "Tafla"
  crossref-sec-prefix: "Kafli"
  crossref-ch-prefix: "Kafli"
  crossref-apx-prefix: "Viðauki"
  section-title-appendices: "Viðaukar"
  toc-title-document: "Efnisyfirlit"
  toc-title-website: "Á þessari síðu"
  code-summary: "Sýna kóða"
  callout-note-title: "Athugið"
  callout-warning-title: "Viðvörun"
  search-no-results-text: "Engar niðurstöður"

format:
  haskoli-islands-html:
    date-format: "D.M.YYYY"
    code-fold: true
    code-summary: "Sýna kóða"
    theme: styles.scss
    # Adds the slides button next to the PDF download (see the partial).
    include-after-body: _partials/slides-button.html
    # Browser tab: "book | chapter" (Quarto's default is "chapter – book").
    template-partials:
      - _partials/metadata.html

  pdf:
    documentclass: scrbook
    papersize: a4
    pdf-engine: xelatex
    toc: true
    number-sections: true
    colorlinks: true
    fig-format: png
    fig-dpi: 150
    keep-tex: false

execute:
  echo: false
  warning: false
  message: false

knitr:
  opts_chunk:
    fig.width: 7
    dpi: 150
