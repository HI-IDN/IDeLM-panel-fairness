<style>
/* Rannís and HÍ logos side by side in the footer band (white on blue).

.corner-logo {
  position: fixed;
  right: 110px;
  bottom: 0;
  height: var(--footer-height);
  display: flex;
  align-items: center;
  gap: 22px;
  z-index: 100;
}
.corner-logo img { height: 32px; width: auto; display: block; }
.corner-logo .rannis-logo { filter: brightness(0) invert(1); }
.corner-logo .divider { width: 1px; height: 28px; background: rgba(255, 255, 255, .55); }
.reveal .footer { padding: 0 380px 0 90px !important; }
.reveal li, .reveal .slides section > p { font-size: 28px; }
.reveal .lead { font-size: 32px !important; }
.reveal .slides h3 { font-size: 28px; }
.reveal .soft p, .reveal .scenario-card p, .reveal .card p, .reveal .goal { font-size: 24px !important; }
.reveal .blue-note p, .reveal .callout p, .reveal .lead, .reveal .goal p, .reveal .big-claim { font-size: 26px !important; }
.reveal .blue-note, .reveal .callout { font-size: 24px !important; max-width: 1060px; margin-top: 34px; }
.reveal .fa-card-body p { font-size: 22px !important; }
.reveal .fa-card-body h3 { font-size: 26px !important; }

.reveal .card .stat-label { font-size: 22px !important; }
.stat { line-height: 1; color: var(--blue); margin: 0 0 10px; }
.stat-label { color: var(--muted); }
.reveal .scenario-card { background: var(--white); border-top: 9px solid var(--blue); padding: 18px 22px; }
.reveal .scenario-card.best { border-top-color: var(--teal); }

.reveal table.results { table-layout: fixed; }
.reveal table.results th:first-child, .reveal table.results td:first-child { width: 34%; }
.reveal table.results th { font-size: 20px !important; text-align: center !important; padding: 10px 12px !important; line-height: 1.2; }
.reveal table.results tbody tr:nth-child(even) td { background: var(--panel-2); }

.reveal .mid { color: var(--muted); font-size: 0.8em; white-space: nowrap; }
.reveal table.roles td:first-child { width: 34%; }
