# The runs of the 2026 round (TÞS), in the order they were made: M1-M3 held, M4 held 2026-10-12
# (its agenda order is in the `position` column of panel.csv, so the model fixes it like the earlier meetings).
# Everything here is code-only; the real files named below stay under data/tdf/ (gitignored).
# Run all:  python scripts/run_round.py scripts/rounds/tdf_2026.yml     one: add --only round4
# `fewest`: R02 is the member who asked for the fewest meetings (first priority of the model).
# `note` is for people; the runner ignores it.
panel: ../data/tdf/panel.csv
results: ../data/tdf/results
free: ../data/tdf/results/rannis_free.txt   # codes of the proposals that came after the plan (make_current_plan.py)
common: >-
  --unavailable ../data/tdf/unavailable.csv --windows ../data/tdf/windows.csv
  --fairness lexburden --meetings-slack 2 --fewest-meetings R02
runs:
  - name: round                # first plan for the remaining meetings, M3 next
    note: M3 as advertised; later meetings free; at most 5 own proposals per meeting
    options: --next-meeting M3
    time_limit: 10800
    check: --next-meeting M3 --max-per-member 5
  - name: round_scratch        # the whole round from the start, nothing fixed
    options: --from-scratch
    time_limit: 10800
    check: --from-scratch --max-per-member 5 --first-meeting-rule
  - name: round2               # as `round`, rerun; and its from-scratch twin below
    options: --next-meeting M3
    time_limit: 10800
    check: --next-meeting M3 --max-per-member 5
  - name: round2_scratch
    options: --from-scratch
    time_limit: 10800
    check: --from-scratch --max-per-member 5 --first-meeting-rule
  - name: round3               # at most 4 own proposals per meeting, higher alpha for members with many proposals
    options: --next-meeting M3 --max-per-member 4 --alpha-file ../data/tdf/alpha_high.csv
    time_limit: 10800
    check: --next-meeting M3 --max-per-member 4
  - name: round4               # alpha by number of proposals in tiers; warm start from round3
    start: round3
    options: --next-meeting M3 --max-per-member 4 --alpha-file ../data/tdf/alpha_tiers.csv
    time_limit: 10800
    check: --next-meeting M3 --max-per-member 4
  - name: round5a              # M1-M3 fixed (M3's order free), M4-M9 optimised; short first run
    options: --fix-meetings M1 M2 M3 --max-per-member 4 --alpha-file ../data/tdf/alpha_tiers.csv
    time_limit: 600
    check: --closed M3 --max-per-member 4
  - name: round5               # the same, improved for 3 hours from round5a
    start: round5a
    options: --fix-meetings M1 M2 M3 --max-per-member 4 --alpha-file ../data/tdf/alpha_tiers.csv
    time_limit: 10800
    check: --closed M3 --max-per-member 4
    note: largest burden 70, Gini 0.143, total waiting 718
  - name: round6               # the same settings, 3 more hours from round5; the plan sent to the funder
    start: round5
    options: --fix-meetings M1 M2 M3 --max-per-member 4 --alpha-file ../data/tdf/alpha_tiers.csv
    time_limit: 10800
    check: --closed M3 --max-per-member 4
    note: a different plan from round5 (33 of 116 proposals in another meeting); largest burden 66, Gini 0.123, total waiting 726
  - name: round7               # as round6, M4 now held as well (14 proposals, order in panel.csv); M5-M9 optimised
    start: round6
    options: --fix-meetings M1 M2 M3 M4 --max-per-member 4 --alpha-file ../data/tdf/alpha_tiers.csv
    time_limit: 10800
    check: --closed M4 --max-per-member 4
  # Four proposals came after the implemented plan (scenario 2) and were put on the last meeting (M9) unordered.
  # First: python scripts/make_current_plan.py ../data/tdf/panel.csv <scenario 2 agenda> <the four, pseudonymised> \
  #          --out ../data/tdf/results/rannis
  # Everything else keeps its meeting of that plan; the four may go to M5-M9; the order is free everywhere.
  # No-one is worse off than in the plan with the four on M9 (rannis_agenda.csv, the four last in M9).
  - name: round8               # the four may go to M5-M9
    panel: ../data/tdf/results/rannis_panel.csv
    start: rannis
    options: >-
      --fix-meetings M1 M2 M3 M4 --keep-meetings --free-proposals {free} --free-meetings M5 M6 M7 M8 M9
      --fairness leximin --no-worse-than ../data/tdf/results/rannis_agenda.csv --max-per-member 5
    time_limit: 3600
    check: --closed M3 M4 --keep-meetings --free-proposals {free} --free-meetings M5 M6 M7 M8 M9 --max-per-member 5
  - name: round8_m9            # the four stay on M9, which is reordered; M5-M8 keep their order
    panel: ../data/tdf/results/rannis_panel.csv
    start: rannis
    options: >-
      --fix-meetings M1 M2 M3 M4 --keep-meetings --free-proposals {free} --free-meetings M9
      --fix-order-from ../data/tdf/results/rannis_agenda.csv --fix-order-meetings M5 M6 M7 M8
      --fairness leximin --no-worse-than ../data/tdf/results/rannis_agenda.csv --max-per-member 5
    time_limit: 1800
    check: --closed M3 M4 --keep-meetings --free-proposals {free} --free-meetings M9 --max-per-member 5
# After round6 the book's scenarios were rerun on the same data:
#   RESULTS=../data/tdf/results/book MODEL_OPTIONS="--fairness lexburden --meetings-slack 2" \
#   ONLY="current free free_sum free_leximin free_noworse free_max4" bash scripts/run_panel_scenarios.sh
