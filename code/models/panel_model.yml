# Settings for the review-panel schedule model (models/panel_model.py).
# Read by the model and by the book (docs/model.qmd), which shows them as a table.
# Command-line options override these values.

alpha: 2              # cost of attending one meeting, in slots (default for every member)
alpha_file: null      # CSV (member, alpha) of alpha per member, overriding the default; null for none
max_per_meeting: 15   # most proposals one meeting can handle
total_weight: 0.01    # weight of the total burden next to the worst-off member's burden
coi_penalty: 1.0      # objective penalty each time a conflicted member is present
time_limit: 600       # solver time limit in seconds
unavailable: null     # CSV of meetings members cannot attend (member, meeting), or null for none
max_per_member: 5     # most own proposals of one member in a meeting not yet held (null: no limit)
soft_max_per_member: 4  # soft cap on own proposals in a meeting; each one above costs soft_max_weight
soft_max_weight: 0.5    # weight of the proposals above the soft cap, per member
first_meeting_rule: true  # first meeting: everyone attends with exactly one proposal
max_meetings_per_member: null  # most meetings one member attends in the round (null: no limit)

# Objectives solved in steps (--fairness lexburden, leximin, ...).
meetings_slack: 0     # the meetings step is held at its value plus this (0: exactly); lets alpha trade meetings for waiting
leximin_levels: 3     # --fairness leximin: how many of the largest burdens are fixed in turn (0: all members)

# Target number of own proposals per meeting attended (soft; used with --target).
members: ../data/tdf/members.csv  # member, new (TRUE/FALSE); relative to code/
target_experienced: 3.5
target_new: 2.5
target_weight: 0.5    # weight of the average deviation from the target, per member
# New members are only readers in the first half of the round. The same meeting ends both:
#   * with --new-editor-from, proposals they edit go to this meeting or later;
#   * their waiting in the meetings before it gets the small learning discount (M^fyrri).
new_editor_from: M5   # first meeting of the second half (null: the middle of the round)

# More, shorter meetings (used with --more-meetings).
extra_meetings: 6     # meetings added after the last planned one
open_meeting_size: 8  # most proposals in a meeting that is not closed
pair_limit: 6         # soft limit on own proposals in two consecutive meetings
pair_weight: 0.5      # weight of the average excess over pair_limit, per member

# Role models (models/role_model.py)
new_editor_share: 0.15 # new members: at most this share as editor (and in assign mode none before the midpoint of their proposals)
max_new_per_proposal: 2  # most new members among the three on a proposal (at least one experienced)
max_editor_share: 0.667  # nobody is editor on more than 2/3 of their proposals
postpone_penalty: 0.5  # objective penalty for each proposal postponed from the next meeting
